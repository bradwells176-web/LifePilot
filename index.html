:root{--bg:#f5f7fb;--card:#fff;--ink:#172033;--muted:#6d7688;--line:#e5e9f1;--p:#5b5cf0;--p2:#7b61ff;--good:#16a34a;--shadow:0 10px 30px rgba(31,41,71,.08)}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#f7f8ff,#eef5ff);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink)}button,input,textarea,select{font:inherit}button{cursor:pointer}.app{max-width:1200px;margin:auto;padding:22px}header{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:22px}.brand{display:flex;align-items:center;gap:12px}.logo{width:48px;height:48px;border-radius:15px;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;display:grid;place-items:center;font-size:24px;font-weight:800}.brand h1{font-size:22px;margin:0}.brand p{margin:2px 0;color:var(--muted);font-size:13px}.top{display:flex;gap:8px}.btn{border:0;border-radius:12px;padding:11px 15px;background:#fff;color:var(--ink);box-shadow:0 3px 12px rgba(0,0,0,.06)}.btn.primary{background:var(--p);color:#fff}.btn.ghost{box-shadow:none;border:1px solid var(--line)}.hero{background:linear-gradient(135deg,#20265f,#5b5cf0);color:#fff;border-radius:26px;padding:28px;box-shadow:var(--shadow);margin-bottom:18px}.hero small{opacity:.75}.hero h2{font-size:32px;margin:7px 0}.hero p{margin:0 0 20px;opacity:.88}.next{background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.18);border-radius:18px;padding:18px}.next strong{font-size:18px}.nextrow{display:flex;justify-content:space-between;align-items:center;gap:15px}.next .btn{background:#fff;color:#272b70}.grid{display:grid;grid-template-columns:1.25fr .75fr;gap:18px}.card{background:var(--card);border:1px solid rgba(229,233,241,.8);border-radius:20px;padding:20px;box-shadow:var(--shadow);margin-bottom:18px}.card h3{margin:0 0 15px;font-size:18px}.sub{color:var(--muted);font-size:13px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{padding:15px;background:#f8f9fd;border-radius:15px}.stat b{display:block;font-size:23px}.stat span{font-size:12px;color:var(--muted)}.item{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0}.check{width:23px;height:23px;border-radius:50%;border:2px solid #cbd2df;background:#fff;flex:none}.check.done{background:var(--good);border-color:var(--good);color:#fff}.itemmain{flex:1}.itemmain b{display:block}.itemmain small{color:var(--muted)}.tag{font-size:11px;padding:5px 8px;border-radius:20px;background:#eef0ff;color:#4d4dd0}.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}.quick button{padding:14px;border:1px dashed #cbd2df;background:#fafbff;border-radius:14px;text-align:left}.quick b{display:block}.quick span{font-size:12px;color:var(--muted)}.progress{height:9px;background:#edf0f5;border-radius:20px;overflow:hidden}.bar{height:100%;background:linear-gradient(90deg,var(--p),#9a70ff);border-radius:20px}.modal{display:none;position:fixed;inset:0;background:rgba(15,20,40,.55);padding:20px;z-index:10;align-items:center;justify-content:center}.modal.show{display:flex}.modalbox{width:min(600px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:24px;padding:22px}.form{display:grid;gap:12px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{font-size:12px;font-weight:700;color:#596274}input,textarea,select{width:100%;margin-top:6px;border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff;color:var(--ink)}textarea{min-height:100px;resize:vertical}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.empty{text-align:center;padding:25px;color:var(--muted)}@media(max-width:800px){.grid{grid-template-columns:1fr}.hero h2{font-size:27px}.nextrow{align-items:flex-start;flex-direction:column}.stats{grid-template-columns:1fr 1fr}.row{grid-template-columns:1fr}}

.voice-card{background:#fff;border:1px solid rgba(229,233,241,.9);border-radius:24px;padding:24px;margin-bottom:18px;box-shadow:var(--shadow);text-align:center}.voice-card h2{margin:4px 0 8px;font-size:28px}.voice-card p{margin:0 auto 18px;color:var(--muted);max-width:560px}.voice-orb{width:96px;height:96px;border-radius:50%;margin:12px auto;background:linear-gradient(135deg,var(--p),var(--p2));display:grid;place-items:center;color:#fff;font-size:38px;box-shadow:0 10px 30px rgba(91,92,240,.3)}.voice-orb.listening{animation:pulse 1.2s infinite}.voice-status{font-size:13px;font-weight:700;color:var(--muted);min-height:20px;margin-bottom:10px}.voice-btn{border:0;border-radius:16px;padding:14px 22px;background:var(--p);color:#fff;font-weight:800;font-size:16px}.voice-btn.stop{background:#20265f}.transcript{min-height:24px;margin:14px auto 0;padding:12px;border-radius:12px;background:#f7f8ff;color:var(--ink);max-width:680px}.voice-examples{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:14px}.voice-examples button{border:1px solid var(--line);background:#fff;border-radius:20px;padding:8px 12px;color:#4d4dd0;font-size:12px}@keyframes pulse{0%,100%{transform:scale(1);box-shadow:0 10px 30px rgba(91,92,240,.3)}50%{transform:scale(1.07);box-shadow:0 14px 42px rgba(91,92,240,.5)}}
